<!DOCTYPE html>
<html>
<head>
<title>Hostel Finder</title>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f0f8ff}
.card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 10px #ccc;max-width:500px;margin:auto}
button{background:#4CAF50;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Hostel Finder 🏨</h1>
<p>Pune madhe best hostel shodha</p>
<input type="text" id="city" placeholder="City taka - ex: Pune" style="padding:10px;width:70%">
<br><br>
<button onclick="alert('Searching hostels in '+document.getElementById('city').value)">Search</button>
<p style="margin-top:20px;color:green">Website is Live ✅</p>
</div>
</body>
</html>
